# town-act preset —— 鱼缸小镇影子会话的工具面（2026-11-21）
#
# 来源：bili-slim/agent.cordis.yml 的行列表（同一份 DSH standard 克隆），
#   只把末尾守卫从 whale-tool-restrict 换成 town-tool-restrict：
#   · whale 只省钱、不拦执行；
#   · town-tool-restrict 是**最窄的 allowlist**：除小镇只读工具外，一律拒绝执行。
#
# 这个会话由 plugins/stellar/lib/scheduler.js 的 townTick 创建（sessionId = town-whale），
# 每天最多 wakeup 3 次、落在 09:00–23:00 的窗口里，只读、不发 QQ、不写文件、不花钱。
# 动作（visit/play/goto）P3 才开，且开的时候是在 MCP 侧按 town.actions 注册工具。
#
# 升级 DSH 后如果 standard preset 变了，用 scripts/sync-bili-slim-preset.mjs 重新拉取，
# 再照着换一次末尾守卫行。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a coding agent powered by the {{model}} model.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: time-context
  name: '@deepseek-ai/dsh-time-context'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: false
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    applyPatch: false
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-schedule
  name: '@deepseek-ai/dsh-tool-schedule'
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: >
          You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches
          the session mode. Imperative language to implement changes means plan the implementation, not execute it. A
          user's conversational agreement — including an answer confirming something you asked — approves nothing and
          does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.


          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual
          repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites
          tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new
          machinery.


          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any
          later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the
          tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an
          approved plan, while the plan itself belongs in exit_plan_mode.


          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material
          ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works
          when you can find out.


          Make the plan decision-complete: state the goal and success criteria; group implementation changes by
          subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests,
          acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that
          another engineer can implement it without making design decisions.


          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode
          the only and final tool call in that assistant response: it presents the plan for approval, and implementation
          begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I
          proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present
          again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes
          manually; do not proceed with implementation.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        # 2026-11-18：默认 thresholdRatio 0.8 在 1M 窗口下等于 72 万 token 才压缩，
        # 实测她的 B站 会话长期停在 30~40 万上下文、每天 100+ 次调用全按 cacheHit 重读，
        # 单日 B站 烧到 1.14 元（占全部 80%）。压到 15%（约 15.7 万）后上下文砍一半以上。
        # retainRatio 0.05（约 4 万）而不是默认 0.16：默认保留量比新阈值还大，会被配置校验直接拒。
        thresholdRatio: 0.15
        retainRatio: 0.05
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelection: true
        modelDiscovery: true
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
- id: present
  name: '@deepseek-ai/dsh-tool-present'
- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true
- id: tool-plugin-market
  name: '@deepseek-ai/dsh-plugin-market/tools'
  disabled: true
- id: town-tool-restrict
  name: stellar/town-tool-restrict.mjs
  config: {}
